[versions]
agp = "8.13.1"
kotlin = "2.0.21"
coreKtx = "1.13.1"
appcompat = "1.7.0"
# MapLibre 11.x uses the OpenGL ES backend (12.x+ default to Vulkan, which
# old/low-end tablet GPUs do not support). Pin to 11.x for wide compatibility.
maplibre = "11.8.0"
nanohttpd = "2.3.1"
# Sentry Android SDK — reports crashes/ANRs/logs to the self-hosted GlitchTip
# server (Sentry-protocol compatible). Pinned to the last 7.x: minSdk-21 safe and
# fully understood by GlitchTip. No Google Play Services dependency.
sentry = "7.22.6"
# Splash screen backport — works to API 21; without it old devices get a white flash on cold start.
splashscreen = "1.0.1"
# Jetpack Compose — the app's UI chrome (menus, dialogs, forms, lists) is drawn in Compose; the
# animated instrument gauges stay on android.graphics.Canvas via Compose's drawIntoCanvas. The
# Compose Compiler plugin is versioned with Kotlin (2.0.x). BOM pins the runtime artifacts.
composeBom = "2024.09.03"
activityCompose = "1.9.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
maplibre = { group = "org.maplibre.gl", name = "android-sdk", version.ref = "maplibre" }
nanohttpd = { group = "org.nanohttpd", name = "nanohttpd", version.ref = "nanohttpd" }
sentry-android = { group = "io.sentry", name = "sentry-android", version.ref = "sentry" }
androidx-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
